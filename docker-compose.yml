services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devassistant
      POSTGRES_PASSWORD: devassistant
      POSTGRES_DB: devassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
volumes:
  pgdata: {}

